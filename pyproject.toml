[project]
name = "ecogrid-ai"
version = "1.0.0"
description = "EcoGrid AI — Energy Management and Decision Support System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.3",
    "flask-cors==6.0.5",
    "python-dotenv==1.0.1",
    "SQLAlchemy==2.0.36",
    "Flask-Migrate==4.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Limiter==3.5.1",
    "gunicorn==23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
    "ruff==0.12.0",
    "black==25.1.0",
    "pre-commit==4.2.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "backend"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["*Test*"]
python_functions = ["test_*"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["backend/app"]
omit = ["backend/venv/*", "backend/tests/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"backend/app/services/insight_service.py" = ["E501"]
"backend/app/services/carbon_service.py" = ["E501"]
"backend/app/integrations/llm_stub.py" = ["E501"]
"backend/app/__init__.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.flask]
app = "backend/app.py"
