name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov ruff black
      - name: Lint with ruff
        run: ruff check backend/app backend/test_api.py || true
      - name: Check formatting with black
        run: black --check backend/app backend/test_api.py || true
      - name: Run tests with coverage
        run: |
          pytest backend/test_api.py --cov=backend/app --cov-report=term-missing --cov-fail-under=50 -v
        working-directory: .
      - name: Health check Flask
        run: |
          python backend/app.py &
          sleep 3
          curl -f http://127.0.0.1:5000/api/health || curl -f http://127.0.0.1:5000/
          pkill -f "python backend/app.py" || true
